<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>무한 숫자 페이지</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a33;
      --text: #e6ecff;
      --muted: #98a2c6;
      --line: #27345f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, #15234f 0%, var(--bg) 45%);
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    header {
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .count {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      margin: 14px 0 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, a.link {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
    }

    #viewport {
      position: relative;
      min-height: 40vh;
    }

    #topSpacer,
    #bottomSpacer {
      width: 100%;
      height: 0;
    }

    #numbers {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    #numbers li {
      height: 52px;
      padding: 14px 16px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--card) 92%, black);
      border: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      font-size: 1.05rem;
      line-height: 22px;
    }

    #sentinel {
      height: 16px;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>무한 숫자 페이지 (가상 렌더링)</h1>
      <div class="count">
        총 기록: <strong id="totalCount">0</strong>개 · 화면 표시: <strong id="visibleCount">0</strong>개
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="controls">
      <a class="link" href="index.html">홈으로</a>
      <button type="button" id="addFast">100개 기록 추가</button>
      <button type="button" id="reset">초기화</button>
    </div>

    <section id="viewport" aria-label="무한 숫자 목록 영역">
      <div id="topSpacer" aria-hidden="true"></div>
      <ul id="numbers" aria-live="polite" aria-label="무한 숫자 목록"></ul>
      <div id="bottomSpacer" aria-hidden="true"></div>
    </section>

    <div id="sentinel" aria-hidden="true"></div>
    <p class="hint">
      화면에 보이지 않는 숫자 DOM은 제거되어 메모리를 절약합니다.<br />
      숫자 기록은 총 개수로 유지되고, 화면에 필요할 때만 다시 렌더링됩니다.
    </p>
  </main>

  <script>
    const ITEM_HEIGHT = 60; // li 높이 + gap 근사값
    const BUFFER = 24;
    const BATCH_SIZE = 80;

    const numbers = document.getElementById('numbers');
    const topSpacer = document.getElementById('topSpacer');
    const bottomSpacer = document.getElementById('bottomSpacer');
    const sentinel = document.getElementById('sentinel');
    const totalCountEl = document.getElementById('totalCount');
    const visibleCountEl = document.getElementById('visibleCount');
    const addFastBtn = document.getElementById('addFast');
    const resetBtn = document.getElementById('reset');

    let totalCount = 0;
    let startIndex = 0;
    let endIndex = 0;
    let rafId = null;

    function formatNumber(value) {
      return value.toLocaleString('ko-KR');
    }

    function growRecords(amount = BATCH_SIZE) {
      totalCount += amount;
      totalCountEl.textContent = formatNumber(totalCount);
      scheduleRender();
    }

    function renderWindow() {
      const viewportHeight = window.innerHeight;
      const scrollTop = window.scrollY;
      const visibleItems = Math.ceil(viewportHeight / ITEM_HEIGHT) + BUFFER;

      const rawStart = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - Math.floor(BUFFER / 2));
      const maxStart = Math.max(0, totalCount - visibleItems);
      const nextStart = Math.min(rawStart, maxStart);
      const nextEnd = Math.min(totalCount, nextStart + visibleItems);

      if (nextStart === startIndex && nextEnd === endIndex) {
        return;
      }

      startIndex = nextStart;
      endIndex = nextEnd;

      const fragment = document.createDocumentFragment();
      for (let i = startIndex; i < endIndex; i += 1) {
        const li = document.createElement('li');
        const number = i + 1;
        li.textContent = `${formatNumber(number)} 번째 숫자`;
        fragment.appendChild(li);
      }

      numbers.replaceChildren(fragment);
      topSpacer.style.height = `${startIndex * ITEM_HEIGHT}px`;
      bottomSpacer.style.height = `${Math.max(0, (totalCount - endIndex) * ITEM_HEIGHT)}px`;
      visibleCountEl.textContent = formatNumber(endIndex - startIndex);
    }

    function scheduleRender() {
      if (rafId) {
        return;
      }
      rafId = requestAnimationFrame(() => {
        rafId = null;
        renderWindow();
      });
    }

    addFastBtn.addEventListener('click', () => growRecords(100));

    resetBtn.addEventListener('click', () => {
      totalCount = 0;
      startIndex = 0;
      endIndex = 0;
      totalCountEl.textContent = '0';
      visibleCountEl.textContent = '0';
      topSpacer.style.height = '0px';
      bottomSpacer.style.height = '0px';
      numbers.replaceChildren();
      window.scrollTo({ top: 0, behavior: 'auto' });
      growRecords(BATCH_SIZE);
    });

    const loadObserver = new IntersectionObserver((entries) => {
      const [entry] = entries;
      if (entry.isIntersecting) {
        growRecords(BATCH_SIZE);
      }
    }, {
      root: null,
      rootMargin: '1200px 0px',
      threshold: 0
    });

    window.addEventListener('scroll', scheduleRender, { passive: true });
    window.addEventListener('resize', scheduleRender);

    growRecords(BATCH_SIZE);
    loadObserver.observe(sentinel);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>무한 숫자 페이지 (가상 렌더링)</title>

  <style>
    :root {
      --bg: #0b1020;
      --card: #121a33;
      --text: #e6ecff;
      --muted: #98a2c6;
      --line: #27345f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, #15234f 0%, var(--bg) 45%);
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(11, 16, 32, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
    }

    .count {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    button, a {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      text-decoration: none;
    }

    #viewport {
      position: relative;
      min-height: 60vh;
    }

    #topSpacer,
    #bottomSpacer {
      height: 0;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    li {
      height: 52px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }

    #sentinel {
      height: 16px;
    }

    .hint {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>

<body>
<header>
  <div class="header-inner">
    <h1>무한 숫자 페이지 (가상 렌더링)</h1>
    <div class="count">
      총 기록: <strong id="totalCount">0</strong> ·
      화면 표시: <strong id="visibleCount">0</strong>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <button id="addFast">100개 추가</button>
    <button id="reset">초기화</button>
  </div>

  <section id="viewport">
    <div id="topSpacer"></div>
    <ul id="numbers"></ul>
    <div id="bottomSpacer"></div>
  </section>

  <div id="sentinel"></div>

  <p class="hint">
    화면에 보이는 숫자만 DOM으로 유지하는 가상 스크롤 예제입니다.<br>
    아래로 스크롤하면 숫자가 계속 추가됩니다.
  </p>
</main>

<script>
  const ITEM_HEIGHT = 60;
  const BUFFER = 24;
  const BATCH_SIZE = 80;

  const numbers = document.getElementById("numbers");
  const topSpacer = document.getElementById("topSpacer");
  const bottomSpacer = document.getElementById("bottomSpacer");
  const sentinel = document.getElementById("sentinel");

  const totalCountEl = document.getElementById("totalCount");
  const visibleCountEl = document.getElementById("visibleCount");
  const addFastBtn = document.getElementById("addFast");
  const resetBtn = document.getElementById("reset");

  let totalCount = 0;
  let startIndex = 0;
  let endIndex = 0;
  let rafId = null;

  const format = n => n.toLocaleString("ko-KR");

  function grow(amount = BATCH_SIZE) {
    totalCount += amount;
    totalCountEl.textContent = format(totalCount);
    schedule();
  }

  function render() {
    const viewportHeight = window.innerHeight;
    const scrollTop = window.scrollY;

    const visible = Math.ceil(viewportHeight / ITEM_HEIGHT) + BUFFER;
    const nextStart = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - BUFFER / 2);
    const nextEnd = Math.min(totalCount, nextStart + visible);

    if (nextStart === startIndex && nextEnd === endIndex) return;

    startIndex = nextStart;
    endIndex = nextEnd;

    const frag = document.createDocumentFragment();
    for (let i = startIndex; i < endIndex; i++) {
      const li = document.createElement("li");
      li.textContent = `${format(i + 1)} 번째 숫자`;
      frag.appendChild(li);
    }

    numbers.replaceChildren(frag);
    topSpacer.style.height = `${startIndex * ITEM_HEIGHT}px`;
    bottomSpacer.style.height = `${(totalCount - endIndex) * ITEM_HEIGHT}px`;
    visibleCountEl.textContent = format(endIndex - startIndex);
  }

  function schedule() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = null;
      render();
    });
  }

  window.addEventListener("scroll", schedule, { passive: true });
  window.addEventListener("resize", schedule);

  addFastBtn.onclick = () => grow(100);

  resetBtn.onclick = () => {
    totalCount = 0;
    startIndex = endIndex = 0;
    numbers.innerHTML = "";
    topSpacer.style.height = bottomSpacer.style.height = "0px";
    window.scrollTo({ top: 0 });
    grow(BATCH_SIZE);
  };

  const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) {
      grow(BATCH_SIZE);
    }
  }, { rootMargin: "1000px" });

  observer.observe(sentinel);
  grow(BATCH_SIZE);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>무한 숫자 페이지</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a33;
      --text: #e6ecff;
      --muted: #98a2c6;
      --accent: #5b8cff;
      --line: #27345f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, #15234f 0%, var(--bg) 45%);
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    header {
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .count {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      margin: 14px 0 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, a.link {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
    }

    #numbers {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    #numbers li {
      padding: 14px 16px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--card) 92%, black);
      border: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      font-size: 1.05rem;
    }

    #sentinel {
      height: 16px;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>무한 숫자 페이지 (JavaScript)</h1>
      <div class="count">현재 표시: <strong id="visibleCount">0</strong>개</div>
    </div>
  </header>

  <main class="wrap">
    <div class="controls">
      <a class="link" href="index.html">홈으로</a>
      <button type="button" id="addFast">100개 빠르게 추가</button>
      <button type="button" id="reset">초기화</button>
    </div>

    <ul id="numbers" aria-live="polite" aria-label="무한 숫자 목록"></ul>
    <div id="sentinel" aria-hidden="true"></div>
    <p class="hint">아래로 스크롤하면 숫자가 계속 추가됩니다.</p>
  </main>

  <script>
    const numbers = document.getElementById('numbers');
    const visibleCount = document.getElementById('visibleCount');
    const sentinel = document.getElementById('sentinel');
    const addFastBtn = document.getElementById('addFast');
    const resetBtn = document.getElementById('reset');

    let current = 1;
    const BATCH_SIZE = 50;

    function addNumbers(batch = BATCH_SIZE) {
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < batch; i += 1) {
        const li = document.createElement('li');
        li.textContent = `${current.toLocaleString('ko-KR')} 번째 숫자`;
        fragment.appendChild(li);
        current += 1;
      }

      numbers.appendChild(fragment);
      visibleCount.textContent = (current - 1).toLocaleString('ko-KR');
    }

    addFastBtn.addEventListener('click', () => addNumbers(100));

    resetBtn.addEventListener('click', () => {
      numbers.innerHTML = '';
      current = 1;
      addNumbers(BATCH_SIZE);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const observer = new IntersectionObserver((entries) => {
      const [entry] = entries;
      if (entry.isIntersecting) {
        addNumbers(BATCH_SIZE);
      }
    }, {
      root: null,
      rootMargin: '800px 0px',
      threshold: 0
    });

    addNumbers(BATCH_SIZE);
    observer.observe(sentinel);
  </script>
</body>
</html>
